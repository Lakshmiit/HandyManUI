name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Yasaswani
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Yasaswani

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # 🔒 HARD LOCK NODE VERSION
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: 'npm'

      # ✅ Install dependencies safely
      - name: Install Dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed."

      # Optional: verify packages
      - name: Verify Installed Packages
        run: |
          npm list firebase || echo "Firebase missing"
          npm list jszip || echo "jszip missing"

      - name: Build the App
        run: npm run build

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PEBBLE_0B4DB7D1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PEBBLE_0B4DB7D1E }}
          action: close
